<html lang="es">
<head>

<title>Revisión de Diagnósticos | Oberon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ===== Página interna: revisión del estudio y generación del PDF ===== */
:root{
  --navy:#0A0F2C; --navy-2:#1B2350; --ink:#1B2350; --ink-2:#4A5275; --ink-3:#7A819E;
  --gold:#D4AF6A; --gold-d:#A9803A; --gold-2:#F0D5A0; --ice:#BFE0F5;
  --paper:#FFFFFF; --soft:#F6F4EE; --line:#E4E2DA;
  --serif:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:var(--sans);background:#2A2F45;color:var(--ink);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;}

/* ---------- panel lateral ---------- */
.app{display:grid;grid-template-columns:400px 1fr;min-height:100vh;}
.side{background:#0A0F2C;color:#F4F2EC;padding:22px 22px 40px;height:100vh;overflow:auto;position:sticky;top:0;border-right:1px solid rgba(191,224,245,.12);}
.side h1{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:0;}
.side .sub{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:4px;}
.box{margin-top:18px;padding:16px;border:1px solid rgba(191,224,245,.14);border-radius:14px;background:rgba(255,255,255,.025);}
.box h2{font-family:var(--mono);font-weight:400;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);margin:0 0 12px;}
.lbl{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,236,.55);margin:12px 0 6px;}
.lbl:first-of-type{margin-top:0;}
.in{width:100%;padding:9px 11px;border-radius:10px;border:1px solid rgba(191,224,245,.2);background:rgba(7,10,30,.6);color:#F4F2EC;font-size:.88rem;}
.in:focus{outline:none;border-color:var(--gold);}
textarea.in{resize:vertical;min-height:90px;line-height:1.5;}
select.in option{background:#0A0F2C;}
.hint{font-size:.72rem;color:rgba(244,242,236,.5);margin-top:6px;line-height:1.45;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btns{display:flex;flex-wrap:wrap;gap:8px;}
.b{border:1px solid rgba(191,224,245,.25);background:rgba(255,255,255,.04);color:#F4F2EC;padding:8px 13px;border-radius:999px;font-size:.8rem;cursor:pointer;}
.b:hover{border-color:var(--gold);color:var(--gold-2);}
.b.pri{background:var(--gold);border-color:var(--gold);color:#0A0F2C;font-weight:700;}
.b.pri:hover{background:var(--gold-2);color:#0A0F2C;}
.b.big{width:100%;padding:13px;font-size:.95rem;border-radius:14px;}
.msg{font-size:.78rem;margin-top:8px;color:#ffb4a6;min-height:1em;}
.msg.ok{color:#8FD9B6;}
.warn{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,138,122,.14);border:1px solid rgba(255,138,122,.4);color:#ffc9bd;font-size:.8rem;}
.warn.on{display:block;}
.rec{border:1px solid rgba(191,224,245,.14);border-radius:12px;padding:10px;margin-top:10px;background:rgba(7,10,30,.35);}
.rec .top{display:flex;gap:6px;}
.rec .top .in{flex:1;}
.rec textarea.in{min-height:60px;margin-top:6px;}
.rec select.in{margin-top:6px;}
.x{flex:none;width:36px;border-radius:10px;border:1px solid rgba(191,224,245,.2);background:transparent;color:rgba(244,242,236,.55);cursor:pointer;}
.x:hover{color:#ffb4a6;border-color:#ffb4a6;}
.lista{display:grid;gap:6px;margin-top:12px;max-height:260px;overflow:auto;}
.lista .it{text-align:left;border:1px solid rgba(191,224,245,.16);background:rgba(7,10,30,.4);color:#F4F2EC;border-radius:10px;padding:8px 10px;font-size:.8rem;cursor:pointer;}
.lista .it:hover,.lista .it.on{border-color:var(--gold);}
.lista .it span{display:block;font-size:.7rem;color:rgba(244,242,236,.55);margin-top:2px;}
.lista .it.late{border-color:rgba(255,138,122,.6);background:rgba(255,138,122,.1);}
.meta{font-size:.8rem;color:rgba(244,242,236,.75);line-height:1.6;}
.meta b{color:#fff;font-weight:600;}

/* ---------- vista previa ---------- */
.preview{padding:32px 24px 60px;overflow:auto;}
.pages{display:flex;flex-direction:column;align-items:center;gap:26px;}
.empty{color:#C9CCE0;text-align:center;margin-top:20vh;font-size:1rem;}

/* ---------- páginas del reporte (tamaño Carta) ---------- */
.page{width:8.5in;height:11in;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;flex-direction:column;}
.pg-in{flex:1;padding:.55in .6in .3in;display:flex;flex-direction:column;min-height:0;}
.pg-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:22px;}
.pg-brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;letter-spacing:.14em;font-size:.82rem;color:var(--ink);}
.pg-brand svg{width:24px;height:24px;}
.pg-ref{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);}
.pg-foot{display:flex;justify-content:space-between;padding:10px .6in 14px;font-family:var(--mono);font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-top:1px solid var(--line);margin:0 0;}
.kick{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);}
.h2{font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1.1;margin:6px 0 0;color:var(--ink);letter-spacing:-.01em;}
.lead{color:var(--ink-2);font-size:.86rem;margin:8px 0 0;line-height:1.5;}
.sec{margin-top:18px;}
.h3{font-family:var(--serif);font-weight:400;font-size:1.08rem;margin:0 0 6px;color:var(--ink);}
.cap{font-size:.7rem;color:var(--ink-3);margin:0 0 6px;}
p.txt{font-size:.82rem;line-height:1.6;color:var(--ink-2);margin:0 0 8px;}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;}
.card.soft{background:var(--soft);border-color:transparent;}

/* portada */
.cover{background:radial-gradient(120% 70% at 50% 0%,#18225C 0%,#0A0F2C 55%,#070A1E 100%);color:#F4F2EC;}
.cover .pg-in{padding:.7in .75in .6in;justify-content:space-between;}
.cover-logo{height:88px;width:auto;}
.cover-stars{position:absolute;inset:0;pointer-events:none;}
.cover .kick{color:var(--gold);}
.cover h1{font-family:var(--serif);font-weight:400;font-size:3.1rem;line-height:1.02;margin:14px 0 0;letter-spacing:-.02em;}
.cover h1 em{font-style:italic;color:var(--gold-2);}
.cover .client{font-family:var(--serif);font-size:1.6rem;margin-top:34px;color:#fff;}
.cover .client small{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,242,236,.55);margin-bottom:6px;}
.cover-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;border-top:1px solid rgba(212,175,106,.4);padding-top:18px;}
.cover-meta small{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,236,.5);}
.cover-meta b{display:block;font-weight:600;font-size:.86rem;margin-top:4px;}
.cover-conf{font-size:.68rem;color:rgba(244,242,236,.55);margin-top:18px;line-height:1.5;max-width:5.6in;}
.gold-line{height:3px;background:linear-gradient(90deg,#c79a52,#f0d5a0,#c79a52);position:absolute;left:0;right:0;top:0;}

/* resumen */
.status{display:grid;grid-template-columns:2.6in 1fr;gap:22px;align-items:center;}
.status svg text.ax{fill:var(--ink-3);}
.badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid currentColor;}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;}
.c-libre{color:#3E7FB8;} .c-sano{color:#2E9E6E;} .c-limite{color:#B7861E;} .c-sobre{color:#D04A40;}
.bigmsg{font-family:var(--serif);font-size:1.3rem;line-height:1.28;margin:10px 0 0;color:var(--ink);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;}
.kpi{border:1px solid var(--line);border-radius:12px;padding:11px 13px;}
.kpi small{display:block;font-family:var(--mono);font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);}
.kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:1.55rem;margin-top:4px;color:var(--ink);}
.kpi span{display:block;font-size:.66rem;color:var(--ink-3);margin-top:2px;}
.interp{border-left:3px solid var(--gold);background:var(--soft);border-radius:0 12px 12px 0;padding:14px 18px;}
.interp p{font-size:.84rem;line-height:1.6;color:var(--ink);margin:0 0 8px;}
.interp p:last-child{margin:0;}
.interp .sig{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d);margin-top:10px;}
ul.find{list-style:none;margin:0;padding:0;display:grid;gap:7px;}
ul.find li{position:relative;padding-left:18px;font-size:.8rem;line-height:1.5;color:var(--ink-2);}
ul.find li::before{content:'';position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:2px;background:var(--gold);}

/* capacidad */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.crow{display:flex;justify-content:space-between;font-size:.76rem;padding:5px 0;border-bottom:1px dashed var(--line);color:var(--ink-2);}
.crow b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
.crow.eq span,.crow.eq b{color:var(--gold-d);}
.crow.tot{border:0;padding-top:9px;}
.crow.tot b{font-family:var(--serif);font-weight:400;font-size:1.25rem;color:var(--gold-d);}

/* gráficas reutilizadas del motor, en tema claro */
.page svg{display:block;width:100%;height:auto;overflow:visible;}
.page .pg-brand svg{width:24px;height:24px;flex:none;}
.page .ax{fill:#6B7290;font-family:'IBM Plex Mono',monospace;font-size:10px;}
.page .grid{stroke:#ECEAE3;}
.page .val{fill:var(--ink);font-family:'Manrope',sans-serif;font-size:10.5px;font-weight:700;}
.dx-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:.64rem;color:var(--ink-2);}
.dx-legend span{display:inline-flex;align-items:center;gap:5px;}
.dx-legend i{width:9px;height:9px;border-radius:2px;}
.dx-legend i.line{height:0;border-top:2px dashed #FF8A7A;border-radius:0;width:14px;}
.dx-hbars{display:grid;gap:9px;margin-top:8px;}
.dx-hbar{display:grid;grid-template-columns:1.4in 1fr .8in;gap:10px;align-items:center;font-size:.76rem;color:var(--ink-2);}
.dx-hbar div{height:20px;border-radius:5px;background:#F1EFE8;overflow:hidden;}
.dx-hbar i{display:block;height:100%;border-radius:5px;}
.dx-hbar b{font-variant-numeric:tabular-nums;color:var(--ink);}
.dx-heat{display:grid;gap:4px;margin-top:8px;font-size:.7rem;}
.dx-heat .hd{font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;color:var(--ink-3);text-align:center;align-self:center;text-transform:capitalize;}
.dx-heat .cell{border-radius:6px;padding:8px 2px;text-align:center;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
.insight{font-size:.74rem;line-height:1.5;color:var(--ink-2);margin:8px 0 0;padding:9px 12px;background:var(--soft);border-radius:8px;}

/* procesos */
table.pt{width:100%;border-collapse:collapse;font-size:.7rem;}
table.pt th{text-align:left;font-family:var(--mono);font-weight:400;font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:6px 6px;border-bottom:1.5px solid var(--ink);}
table.pt td{padding:5px 6px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top;}
table.pt .n{text-align:right;font-variant-numeric:tabular-nums;}
table.pt td.n{color:var(--ink);font-weight:600;}
table.pt tfoot td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:700;color:var(--ink);}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;}
.qtag{display:inline-block;font-size:.58rem;padding:2px 7px;border-radius:999px;white-space:nowrap;}
.qWin{background:rgba(46,158,110,.14);color:#1F7A53;} .qQuick{background:rgba(62,127,184,.13);color:#2E6596;}
.qLean{background:rgba(183,134,30,.14);color:#8A6414;} .qLow{background:#F1EFE8;color:#6B7290;}
.page svg .q{fill:#6B7290;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.04em;}
.page svg .mid{stroke:#D9D6CC;stroke-dasharray:4 4;}
.page svg .axl{stroke:#C9C6BC;}
.page svg .pt{fill:var(--ink);font-family:'Manrope',sans-serif;font-size:11px;font-weight:700;}

/* recomendaciones */
.hz{margin-top:14px;}
.hz-t{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);margin-bottom:8px;}
.hz-t::after{content:'';flex:1;height:1px;background:var(--line);}
.ritem{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.ritem:last-child{border:0;}
.ritem .nb{width:26px;height:26px;border-radius:50%;background:var(--navy-2);color:var(--gold-2);display:grid;place-items:center;font-family:var(--mono);font-size:.66rem;}
.ritem b{display:block;font-size:.84rem;color:var(--ink);}
.ritem span{display:block;font-size:.76rem;line-height:1.5;color:var(--ink-2);margin-top:2px;}
.cta{margin-top:auto;border-radius:14px;padding:18px 20px;background:linear-gradient(120deg,#0A0F2C,#1B2350);color:#F4F2EC;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;}
.cta b{font-family:var(--serif);font-weight:400;font-size:1.2rem;display:block;}
.cta span{font-size:.76rem;color:rgba(244,242,236,.75);display:block;margin-top:4px;}
.cta a{display:inline-block;background:var(--gold);color:#0A0F2C;font-weight:700;font-size:.78rem;text-decoration:none;padding:10px 16px;border-radius:999px;white-space:nowrap;}
.cta .ct{font-size:.68rem;color:rgba(244,242,236,.6);margin-top:8px;}
.assume{font-size:.66rem;line-height:1.5;color:var(--ink-3);margin-top:12px;}

@page{size:letter;margin:0;}
@media print{
  body{background:#fff;}
  .app{display:block;}
  .side{display:none;}
  .preview{padding:0;overflow:visible;}
  .pages{gap:0;}
  .page{box-shadow:none;break-after:page;page-break-after:always;}
  .page:last-child{break-after:auto;page-break-after:auto;}
}
@media (max-width:1100px){.app{grid-template-columns:1fr;}.side{position:static;height:auto;}}
</style>
</head>

</div>

/* ---------------- Borrador automático de recomendaciones ---------------- */
function draftRecs(r) {
  const out = [];
  const gap = r.total - r.capTeam, fteH = (h) => fte(r.capPerson ? h / r.capPerson : 0);
  const wins = r.procs.filter((x) => quadrant(x, r) === 'qWin').sort((a, b) => b.lib - a.lib);
  if (gap > 0) out.push({ title:t('rGapT'), detail:fill(t('rGapD'), { h:nf(gap), f:fteH(gap), l:nf(wins.reduce((a, x) => a + x.lib, 0) || r.lib) }), hz:'1' });
  else if (r.util < .7) out.push({ title:t('rFreeT'), detail:fill(t('rFreeD'), { h:nf(-gap), f:fteH(-gap) }), hz:'2' });
  const tools = (x) => x.p.tools.map((k) => window.DX_TEXT[lang()].tools[k]).join(', ');
  (wins.length ? wins : r.procs.slice().sort((a, b) => b.lib - a.lib)).slice(0, 2)
    .forEach((x) => out.push({ title:fill(t('rAutoT'), { c:x.code }), detail:fill(t('rAutoD'), { a:pct(x.auto), h:nf(x.lib), tools:tools(x) || '—' }), hz:'2' }));
  r.procs.filter((x) => x.p.doc === 'no' || x.p.rules === 'rJudg').slice(0, 1)
    .forEach((x) => out.push({ title:fill(t('rStdT'), { c:x.code }), detail:t('rStdD'), hz:'1' }));
  const rw = r.procs.filter((x) => num(x.p.rework) >= 10).sort((a, b) => num(b.p.rework) - num(a.p.rework))[0];
  if (rw) out.push({ title:fill(t('rRwT'), { c:rw.code }), detail:fill(t('rRwD'), { r:nf(num(rw.p.rework)) + '%' }), hz:'2' });
  const cells = []; r.cells.forEach((w) => w.forEach((d) => cells.push(r.capDay ? d.reduce((a, b) => a + b, 0) / r.capDay : 0)));
  if (Math.max(...cells) - Math.min(...cells) > .35) out.push({ title:t('rBalT'), detail:t('rBalD'), hz:'1' });
  return out;
}

function stars(seed) {
  let s = seed; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const pts = Array.from({ length:70 }, () => [rnd() * 816, rnd() * 1056, rnd() * 1.4 + .3, rnd() * .6 + .2]);
  let g = pts.map(([x, y, r, o]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="#F4F2EC" opacity="${o.toFixed(2)}"/>`).join('');
  const c = [[560, 170], [640, 230], [700, 190], [735, 300], [660, 360], [610, 300]];
  g += `<polyline points="${c.map((p) => p.join(',')).join(' ')}" fill="none" stroke="rgba(212,175,106,.35)" stroke-width="1"/>` + c.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="#F0D5A0"/>`).join('');
  return `<svg class="cover-stars" viewBox="0 0 816 1056" preserveAspectRatio="none">${g}</svg>`;
}

function renderReport() {
  if (!P) { $pages.innerHTML = `<p class="empty">${esc(tl('choose'))}</p>`; return; }
  const r = calc(), e = P.entrada, c = P.contacto || {}, st = status(r.util);
  const key = st[0].toUpperCase() + st.slice(1);
  const who = e.mode === 'proc' ? t('who_proc') : t('who_dept');
  const margin = Math.abs(r.capTeam - r.total), mFte = r.capPerson ? margin / r.capPerson : 0;
  const shown = r.procs.filter((x) => x.annual > 0);
  const legend = shown.map((x) => `<span><i style="background:${x.color}"></i>${esc(x.code)}</span>`).join('') + `<span><i class="line"></i>${esc(t('capLine'))}</span>`;
  const months = Array.from({ length:12 }, (_, i) => new Intl.DateTimeFormat(lang() === 'pt' ? 'pt-BR' : lang() === 'en' ? 'en-US' : 'es-MX', { month:'short' }).format(new Date(2026, i, 1)).replace('.', ''));
  const wt = r.weeks.map((w) => w.reduce((a, b) => a + b, 0)), pkW = wt.indexOf(Math.max(...wt));
  const TOTAL = 6, ref = `${t('coverTitle').replace(/<[^>]+>/g, '')} · ${P.folio}`;
  const head = `<div class="pg-head"><div class="pg-brand">${mark}OBERON</div><div class="pg-ref">${esc(ref)}</div></div>`;
  const foot = (n) => `<div class="pg-foot"><span>${esc(c.empresa || '')}</span><span>${esc(fill(t('pageOf'), { n, t:TOTAL }))}</span></div>`;
  const page = (n, kick, title, sub, body) => `<section class="page"><div class="pg-in">${head}<div class="kick">${String(n - 1).padStart(2, '0')} · ${esc(kick)}</div><h2 class="h2">${esc(title)}</h2>${sub ? `<p class="lead">${esc(sub)}</p>` : ''}${body}</div>${foot(n)}</section>`;

  // Hallazgos automáticos
  const top = shown.slice().sort((a, b) => b.annual - a.annual)[0];
  const find = [
    fill(t('msg' + key), { who, u:pct(r.util), o:pct(r.util - 1) }) + ' ' + fill(t('msg2' + key), { h:nf(margin), f:fte(mFte) }),
    r.peakUtil > r.util + .08 ? fill(t('peak'), { p:pct(r.peakUtil) }) : '',
    balanceMsg(r),
    fill(t('fAuto'), { a:pct(r.auto), h:nf(r.lib), f:nf(r.capPerson ? r.lib / r.capPerson : 0, 2) }),
    top ? fill(t('fTop'), { c:top.code, p:pct(top.annual / r.total), h:nf(top.annual) }) : '',
  ].filter(Boolean);

  // Recomendaciones por horizonte
  const byHz = ['1','2','3'].map((h) => [h, RS.recs.filter((x) => x.hz === h && (x.title || x.detail))]).filter(([, l]) => l.length);
  let nRec = 0;
  const recHtml = byHz.length ? byHz.map(([h, l]) => `<div class="hz"><div class="hz-t">${esc(t('hz' + h))}</div>${l.map((x) => `<div class="ritem"><div class="nb">${++nRec}</div><div><b>${esc(x.title)}</b><span>${esc(x.detail)}</span></div></div>`).join('')}</div>`).join('') : `<p class="txt">${esc(t('recEmpty'))}</p>`;

  const freqTxt = (p) => t('f' + p.freq) + (p.freq === 'w' ? ` · ${p.days.map((d) => dayName(d)).join(', ')}${p.weeks.length < 4 ? ` · ${t('weekS')} ${p.weeks.join(', ')}` : ''}` : p.freq === 'q' ? ` · ${p.days.map((d) => dayName(d)).join(', ')}` : p.freq === 'm' ? ` · ${t('weekS')} ${num(p.week) || 4}` : '');

  CW = 700; const chMonth = stackChart(months, r.months, r.procs, r.capMonth, 230);
  CW = 700; const chWeek = stackChart([1,2,3,4].map((n) => `${t('weekS')} ${n}`), r.weeks, r.procs, r.capWeek, 190);
  CW = 330; const chPeak = stackChart([...Array(r.nd).keys()].map((d) => dayName(d)), r.cells[pkW], r.procs, r.capDay, 230);

  $pages.innerHTML = `
  <section class="page cover"><div class="gold-line"></div>${stars(20261103)}
    <div class="pg-in" style="position:relative">
      <div><img class="cover-logo" src="img/oberon-logo.webp" alt="Oberon"></div>
      <div>
        <div class="kick">${esc(t('coverKicker'))}</div>
        <h1>${t('coverTitle')}</h1>
        <div class="client"><small>${esc(t('prepFor'))}</small>${esc(c.empresa || '')}</div>
        <div style="margin-top:6px;color:rgba(244,242,236,.75);font-size:.9rem">${esc(c.nombre || '')}${c.puesto ? ' · ' + esc(c.puesto) : ''}</div>
      </div>
      <div>
        <div class="cover-meta">
          <div><small>${esc(t('folio'))}</small><b>${esc(P.folio)}</b></div>
          <div><small>${esc(t('dateL'))}</small><b>${esc(fmtDate(RS.date))}</b></div>
          <div><small>${esc(t('scope'))}</small><b>${esc(e.mode === 'proc' ? t('scopeProc') : t('scopeDept'))} · ${esc(window.DX_TEXT[lang()].countries[e.country] || e.country)}</b></div>
          <div><small>${esc(t('prepBy'))}</small><b>${esc(RS.consultant)}</b></div>
          <div style="grid-column:span 2"><small>&nbsp;</small><b style="font-weight:500;color:rgba(244,242,236,.75)">${esc(RS.role)}</b></div>
        </div>
        <p class="cover-conf">${esc(t('conf'))}</p>
      </div>
    </div>
  </section>

  ${page(2, t('p2'), t('p2'), t('p2s'), `
    <div class="sec status">
      <div>${gauge(r.util, st)}</div>
      <div><span class="badge c-${st}"><i></i>${esc(t('st' + key))}</span>
        <p class="bigmsg">${esc(fill(t('msg' + key), { who, u:pct(r.util), o:pct(r.util - 1) }))}</p></div>
    </div>
    <div class="kpis">
      <div class="kpi"><small>${esc(t('kFte'))}</small><b class="c-${st}">${nf(r.fteReq, 2)}</b><span>${esc(fill(t('kFteS'), { a:nf(r.fteAvail, r.fteAvail % 1 ? 2 : 0) }))}</span></div>
      <div class="kpi"><small>${esc(t('kLoad'))}</small><b>${nf(r.total)} h</b><span>${esc(fill(t('kLoadS'), { c:nf(r.capTeam) }))}</span></div>
      <div class="kpi"><small>${esc(t('kAuto'))}</small><b style="color:var(--gold-d)">${pct(r.auto)}</b><span>${esc(t('kAutoS'))}</span></div>
      <div class="kpi"><small>${esc(t('kFree'))}</small><b style="color:#2E9E6E">${nf(r.lib)} h</b><span>${esc(fill(t('kFreeS'), { f:nf(r.capPerson ? r.lib / r.capPerson : 0, 2) }))}</span></div>
    </div>
    ${RS.interp.trim() ? `<div class="sec"><h3 class="h3">${esc(t('kInterp'))}</h3><div class="interp">${paras(RS.interp)}<div class="sig">— ${esc(RS.consultant)}</div></div></div>` : ''}
    <div class="sec"><h3 class="h3">${esc(t('findings'))}</h3><ul class="find">${find.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>
  `)}

  ${page(3, t('p3'), t('p3'), t('p3s'), `
    <div class="sec two">
      <div class="card">
        <h3 class="h3">${esc(t('capTitle'))}</h3>
        <div class="crow"><span>${esc(t('cJornada'))}</span><b>${nf(num(e.hoursDay), 1)} h</b></div>
        <div class="crow"><span>${esc(t('cLunch'))} · ${esc(t('cBreaks').replace('− ', ''))}</span><b>${nf(num(e.lunch) / 60 + num(e.breaks) / 60, 2)} h</b></div>
        <div class="crow eq"><span>${esc(t('cEff'))}</span><b>${nf(r.hEff, 2)} h</b></div>
        <div class="crow"><span>${esc(t('cDays'))}</span><b>${nf(r.daysBase)}</b></div>
        <div class="crow"><span>${esc(t('cHol'))} · ${esc(t('cVac').replace('− ', ''))}</span><b>${nf(num(e.holidays))} · ${nf(num(e.vacation))}</b></div>
        <div class="crow eq"><span>${esc(t('cAvail'))}</span><b>${nf(r.daysAvail)}</b></div>
        <div class="crow"><span>${esc(t('cPerson'))}</span><b>${nf(r.capPerson, 1)} h</b></div>
        <div class="crow"><span>${esc(t('cTimes'))}${e.mode === 'proc' ? ' · ' + esc(t('cDed').replace('× ', '')) : ''}</span><b>${nf(num(e.people))}${e.mode === 'proc' ? ' · ' + nf(r.ded * 100) + '%' : ''}</b></div>
        <div class="crow tot"><span>${esc(t('cTeam'))}</span><b>${nf(r.capTeam)} h</b></div>
      </div>
      <div class="card soft">
        <h3 class="h3">${esc(t('capHow'))}</h3>
        <p class="txt">${esc(t('capHowT'))}</p>
        <p class="txt">${esc(t('capNote'))}</p>
      </div>
    </div>
    <div class="sec"><h3 class="h3">${esc(t('chA'))}</h3><p class="cap">${esc(t('chAp'))}</p>${annualChart(r)}</div>
    <div class="sec"><h3 class="h3">${esc(t('chM'))}</h3><p class="cap">${esc(t('chMp'))}</p>${chMonth}<div class="dx-legend">${legend}</div></div>
  `)}

  ${page(4, t('p4'), t('p4'), t('p4s'), `
    <div class="sec"><h3 class="h3">${esc(t('chW'))}</h3><p class="cap">${esc(t('chWp'))}</p>${chWeek}<div class="dx-legend">${legend}</div></div>
    <div class="sec two">
      <div><h3 class="h3">${esc(t('chD'))}</h3><p class="cap">${esc(t('chDp'))}</p>${heatmap(r)}</div>
      <div><h3 class="h3">${esc(t('chPk'))}</h3><p class="cap">${esc(fill(t('chPkp'), { w:pkW + 1 }))}</p>${chPeak}</div>
    </div>
    <p class="insight">${esc(balanceMsg(r))}</p>
  `)}

  ${page(5, t('p5'), t('p5'), t('p5s'), `
    <div class="sec"><h3 class="h3">${esc(t('mxT'))}</h3><p class="cap">${esc(t('mxNote'))}</p>${matrix(r, 700, 330)}</div>
    <div class="sec"><table class="pt">
      <thead><tr><th>${esc(t('thCode'))}</th><th>${esc(t('thFreq'))}</th><th class="n">${esc(t('thHours'))}</th><th class="n">FTE</th><th class="n">${esc(t('thShare'))}</th><th class="n">${esc(t('thAuto'))}</th><th>${esc(t('thQuad'))}</th></tr></thead>
      <tbody>${shown.map((x) => `<tr><td><span class="dot" style="background:${x.color}"></span>${esc(x.code)}</td><td>${esc(freqTxt(x.p))}</td><td class="n">${nf(x.annual, 1)}</td><td class="n">${nf(x.fte, 2)}</td><td class="n">${pct(x.annual / r.total)}</td><td class="n">${pct(x.auto)}</td><td><span class="qtag ${quadrant(x, r)}">${esc(t(quadrant(x, r)))}</span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="2">${esc(t('total'))}</td><td class="n">${nf(r.total, 1)}</td><td class="n">${nf(r.fteReq, 2)}</td><td class="n">100%</td><td class="n">${pct(r.auto)}</td><td></td></tr></tfoot>
    </table></div>
  `)}

  ${page(6, t('p6'), t('p6'), t('p6s'), `
    <div class="sec">${recHtml}</div>
    ${RS.next.trim() ? `<div class="sec"><h3 class="h3">${esc(t('nextT'))}</h3><ul class="find">${RS.next.split(/\n\s*\n|\n/).map((x) => x.trim()).filter(Boolean).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    <p class="assume">${esc(fill(t('assume'), { d:nf(Math.max(0, num(e.daysWeek) * 52 - num(e.holidays))), h:nf(num(e.holidays)), v:nf(num(e.vacation)) }))}</p>
    <div class="cta" style="margin-top:auto"><div><b>${esc(t('ctaT'))}</b><span>${esc(t('ctaD'))}</span><div class="ct">${esc(RS.consultant)} · lurias@oberontd.com · 33-3015-3089 · oberontd.com</div></div><a href="${AGENDA}">${esc(t('ctaB'))}</a></div>
  `)}`;
  checkOverflow();
}

function checkOverflow() {
  const w = document.getElementById('warn'); if (!w) return;
  const bad = [...document.querySelectorAll('.page')].map((pg, i) => { const inn = pg.querySelector('.pg-in'); return inn.scrollHeight > inn.clientHeight + 2 ? i + 1 : 0; }).filter(Boolean);
  w.classList.toggle('on', bad.length > 0);
  w.textContent = bad.map((n) => fill(tl('overflow'), { n })).join(' ');
}

/* ---------------- Eventos ---------------- */
let tm;
const later = () => { clearTimeout(tm); tm = setTimeout(() => { saveDraft(); renderReport(); }, 180); };
const lmsg = (txt, ok) => { const m = document.getElementById('lmsg'); if (m) { m.textContent = txt; m.className = 'msg' + (ok ? ' ok' : ''); } };
const tryLoad = (obj) => { try { loadPayload(obj); lmsg(tl('loaded'), true); } catch (e) { lmsg(tl('badJson')); } };

$side.addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-a]');
  const rd = ev.target.closest('[data-rdel]');
  if (rd) { RS.recs.splice(+rd.dataset.rdel, 1); saveDraft(); renderSide(); renderReport(); return; }
  const fo = ev.target.closest('[data-folio]');
  if (fo) { openFolio(fo.dataset.folio); return; }
  if (!a) return;
  const act = a.dataset.a;
  if (act === 'list') { cmsg(R.es.working, true); api({ accion:'lista' }).then((j) => { if (!j.ok) throw j; LISTA = j.lista; CMSG = ''; renderSide(); }).catch((j) => cmsg(apiErr(j))); return; }
  if (act === 'open') { const f = document.getElementById('folioIn').value.trim().toUpperCase(); if (f) openFolio(f); return; }
  if (act === 'sent') { apiPost({ accion:'estado', folio:P.folio, estado:'Enviado' }).then((j) => { if (!j.ok) throw j; ESTADO = 'Enviado'; if (LISTA) LISTA.forEach((x) => { if (x.folio === P.folio) x.estado = 'Enviado'; }); renderSide(); }).catch((j) => alert(apiErr(j))); return; }
  if (act === 'ex') tryLoad(samplePayload());
  else if (act === 'last') { let p = null; try { p = JSON.parse(localStorage.getItem('oberon-dx-ultimo-envio') || 'null'); } catch (e) {} if (p) tryLoad(p); else lmsg(tl('noLast')); }
  else if (act === 'paste') { let p = null; try { p = JSON.parse(document.getElementById('paste').value); } catch (e) {} tryLoad(p); }
  else if (act === 'draft') { RS.recs = draftRecs(calc()); saveDraft(); renderSide(); renderReport(); }
  else if (act === 'add') { RS.recs.push({ title:'', detail:'', hz:'1' }); saveDraft(); renderSide(); }
  else if (act === 'print') { renderReport(); setTimeout(() => window.print(), 150); }
});
$side.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'clave') { CLAVE = el.value.trim(); try { localStorage.setItem('oberon-dx-clave', CLAVE); } catch (e) {} return; }
  if (el.dataset.r) {
    RS[el.dataset.r] = el.value;
    if (el.dataset.r === 'lang') { saveDraft(); renderSide(); renderReport(); return; }
    later();
  } else if (el.dataset.rec != null) { RS.recs[+el.dataset.rec][el.dataset.f] = el.value; later(); }
});
$side.addEventListener('change', (ev) => {
  if (ev.target.id !== 'file' || !ev.target.files[0]) return;
  ev.target.files[0].text().then((txt) => { let p = null; try { p = JSON.parse(txt); } catch (e) {} tryLoad(p); });
});

renderSide(); renderReport();
// ?folio=OB-… (enlace del correo de aviso) abre el estudio directo si ya guardaste tu clave
const qFolio = new URLSearchParams(location.search).get('folio');
if (qFolio && ENDPOINT && CLAVE) openFolio(qFolio);
// ?ejemplo carga el estudio de muestra con un borrador listo (para revisar el diseño)
if (new URLSearchParams(location.search).has('ejemplo')) {
  loadPayload(samplePayload());
  if (!RS.recs.length) RS.recs = draftRecs(calc());
  if (!RS.interp) RS.interp = 'El área de Finanzas opera prácticamente al límite de su capacidad, con picos claros en la semana de cierre, cuando la carga supera la jornada disponible.\n\nLa mayor oportunidad está en el registro de facturas de proveedores: es repetitivo, sigue reglas fijas y hoy depende de correo y PDF. Automatizarlo liberaría tiempo suficiente para absorber el cierre sin horas extra.';
  renderSide(); renderReport();
}
})();
</script>
</body>
</html>
